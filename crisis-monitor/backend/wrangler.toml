name = "mutie"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# Create with: wrangler d1 create sentinel
# Then paste the returned database_id below.
[[d1_databases]]
binding = "DB"
database_name = "sentinel"
database_id = "c7214227-21e8-4223-9ea5-50e82f851556"

# Workers AI — account-level, no separate resource to create first (unlike
# D1/Queues above/below), billed per-request on Cloudflare's usual Workers
# AI pricing. Used by lib/translate.ts for African local-language press.
[ai]
binding = "AI"

# Fans the Africa Wire crawl (durableObjects/africaWireActor.ts) out across
# many consumer invocations instead of one Durable Object working through a
# fixed-size batch per cron tick. Queue itself was created out-of-band via
# the Cloudflare dashboard (Queues -> Create queue, named exactly
# "africa-wire-crawl") since this repo's deploys run through Cloudflare's
# Git-connected Workers Build, not a local `wrangler` with account access.
[[queues.producers]]
queue = "africa-wire-crawl"
binding = "AFRICA_WIRE_QUEUE"

[[queues.consumers]]
queue = "africa-wire-crawl"
# Keeps each consumer invocation's concurrent outbound fetches (one per
# message, each with its own 8s timeout in africaWireActor.ts) comparable to
# the old BATCH_SIZE=60 Promise.all, rather than handing the DO a flood of
# concurrent /process-source calls at once.
max_batch_size = 10
max_batch_timeout = 5
max_retries = 3

[[durable_objects.bindings]]
name = "LIVE_FEED"
class_name = "LiveFeedHub"

[[durable_objects.bindings]]
name = "INGESTION_ACTOR"
class_name = "IngestionActor"

[[durable_objects.bindings]]
name = "ALERTING_ACTOR"
class_name = "AlertingActor"

[[durable_objects.bindings]]
name = "AIS_INGESTION_ACTOR"
class_name = "AisIngestionActor"

[[durable_objects.bindings]]
name = "AFRICA_WIRE_ACTOR"
class_name = "AfricaWireActor"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["LiveFeedHub", "IngestionActor", "AlertingActor"]

# Durable Object migrations are additive/append-only — a new class goes in
# its own tag rather than editing v1's list above.
[[migrations]]
tag = "v2"
new_sqlite_classes = ["AisIngestionActor"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["AfricaWireActor"]

# Polls GDELT every 5 minutes when GDELT_ENABLED=true, and re-kicks the
# ingestion/alerting Durable Object alarms as a safety net (see src/index.ts).
[triggers]
crons = ["*/5 * * * *"]

[vars]
MOCK_MODE = "false"
# No AI calls before this UTC date. The free allowance for 5 October 2026 was
# used up by translation before the daily ceiling (src/lib/aiBudget.ts)
# existed, so anything further that day would have been billed. From this
# date the ceiling alone applies; the line can stay.
AI_BUDGET_NOT_BEFORE = "2026-10-06"
GDELT_ENABLED = "true"

[observability.logs]
enabled = true
invocation_logs = true
